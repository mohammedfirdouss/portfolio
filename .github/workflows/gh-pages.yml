name: Redirect GitHub Pages to mohammedfirdous.fyi

# The site moved to https://mohammedfirdous.fyi (Cloudflare Pages). GitHub
# Pages now serves only a redirect, so old /portfolio/... links keep working.
# GitHub Pages serves 404.html for every unknown path, which covers deep links.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/gh-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Moved to mohammedfirdous.fyi</title>
          <link rel="canonical" href="https://mohammedfirdous.fyi/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://mohammedfirdous.fyi/">
          <script>
            var path = location.pathname.replace(/^\/portfolio/, "") || "/";
            location.replace("https://mohammedfirdous.fyi" + path + location.search + location.hash);
          </script>
          </head>
          <body>
          <p>This site has moved to <a href="https://mohammedfirdous.fyi/">mohammedfirdous.fyi</a>.</p>
          </body>
          </html>
          EOF
          cp out/index.html out/404.html
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
